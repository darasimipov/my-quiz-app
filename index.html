<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A short introductory computer quiz with instant scoring."
    />
    <title>Quiz App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="quiz-card">
\

      <h1 class="title">Computer Quiz App</h1>
      <div class="divider" aria-hidden="true"></div>

      <section class="screen" id="quiz-screen" aria-label="Quiz questions">
        <p class="question-count" id="question-count">Question 1 of 8</p>

        <div class="question-block" id="question-block">
          <h2 class="question" id="question-text"></h2>
          <p class="hint">Choose only 1 answer:</p>
          <div
            class="options"
            id="options"
            role="radiogroup"
            aria-labelledby="question-text"
          ></div>
        </div>

        <div class="quiz-actions">
          <button type="button" class="button" id="next-btn" disabled>
            Next Question
          </button>
        </div>
      </section>

      <section class="screen" id="result-screen" aria-label="Quiz results" hidden>
        <p class="eyebrow">Quiz complete</p>

        <div class="score-ring" id="score-ring">
          <div class="score-ring-inner">
            <span class="score-value" id="score-value">0 / 8</span>
            <span class="score-label">answers correct</span>
          </div>
        </div>

        <div class="quiz-actions quiz-actions--center">
          <button type="button" class="button" id="retake-btn">
            Retake Quiz
          </button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
